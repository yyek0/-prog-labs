<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Анимация средствами CSS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Анимация средствами CSS</h1>
        <p>На первые два блока наведите указатель мыши.</p>
        <label for="pause">Приостановить автоматическую анимацию</label>
        <input type="checkbox" id="pause">
        <div class="examples">
            <div class="demo">
                <div class="box grow"></div>
                <p>Размер и цвет</p>
            </div>
            <div class="demo">
                <div class="box fade"></div>
                <p>Прозрачность и форма</p>
            </div>
            <div class="demo">
                <div class="box route"></div>
                <p>Движение и поворот</p>
            </div>
            <div class="demo">
                <div class="box pulse"></div>
                <p>Цвет и превращение</p>
            </div>
        </div>
        <h2>Вращающийся куб</h2>
        <div class="scene">
            <div class="cube">
                <div class="face face1"> 1</div>
                <div class="face face2">2</div>
                <div class="face face3">3</div>
                <div class="face face4">4</div>
                <div class="face face5">5</div>
                <div class="face face6">6</div>
            </div>
        </div>
        <p>
            Пример адаптирован из
            <a href="https://www.w3schools.com/css/css3_3dtransforms_cube.asp">W3Schools — CSS 3D Cube</a>
            .
        </p>
    </body>
</html>
