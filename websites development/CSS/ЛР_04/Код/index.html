<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Возможности Flexbox</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Четыре Flex-контейнера</h1>
        <h2>Строка с равномерными промежутками</h2>
        <div class="flex one">
            <div> 1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
        <h2>Обратный порядок</h2>
        <div class="flex two">
            <div> 1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
        <h2>Перенос и отдельное выравнивание</h2>
        <div class="flex three">
            <div> 1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
        <h2>Вертикальное направление</h2>
        <div class="flex four">
            <div> 1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
    </body>
</html>
