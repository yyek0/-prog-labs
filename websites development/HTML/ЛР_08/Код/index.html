<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Анкета для трудоустройства</title></head>
<body style="background:#fff5a6">
  <h1><font color="blue" face="Courier New">Анкета для трудоустройства</font></h1>
  <form action="#" method="get">
    <p><label>Имя: <input type="text" name="first_name" maxlength="30" required></label></p>
    <p><label>Фамилия: <input type="text" name="last_name" maxlength="30" required></label></p>
    <p><label>Почта: <input type="email" name="email" required></label></p>
    <p><label>Телефон: <input type="tel" name="phone" pattern="[0-9+() -]{7,20}" title="От 7 до 20 цифр и допустимых знаков" required></label></p>
    <fieldset><legend>Возраст</legend>
      <label><input type="radio" name="age" value="under18" checked> Младше 18</label><br>
      <label><input type="radio" name="age" value="18-24"> От 18 до 24</label><br>
      <label><input type="radio" name="age" value="25-35"> От 25 до 35</label><br>
      <label><input type="radio" name="age" value="over35"> Старше 35</label>
    </fieldset>
    <p><label for="gender">Пол:</label>
      <select name="gender" id="gender"><option value="male">Мужской</option><option value="female">Женский</option><option value="other">Другой</option></select></p>
    <p><label for="jobs">Желаемая работа (можно выбрать несколько):</label><br>
      <select name="jobs" id="jobs" size="8" multiple>
        <optgroup label="Журналистика"><option value="art">Искусство</option><option value="tourism">Туризм</option></optgroup>
        <optgroup label="Программирование"><option value="html">HTML</option><option value="php">PHP</option></optgroup>
        <optgroup label="Создание сайтов"><option value="design">Дизайн</option><option value="layout">Вёрстка</option></optgroup>
        <optgroup label="Перевод"><option value="english">Английский</option><option value="french">Французский</option></optgroup>
      </select></p>
    <p><label for="salary">Желаемая зарплата от 0 до 100 000:</label>
      <input id="salary" type="range" name="salary" min="0" max="100000" step="1000"></p>
    <p><label for="agreement">Условия:</label><br>
      <textarea id="agreement" rows="3" cols="45" readonly>Анкета создана для учебной работы. Данные никуда не отправляются.</textarea></p>
    <p><label for="comment">Комментарий:</label><br><textarea id="comment" name="comment" rows="4" cols="45"></textarea></p>
    <p><label><input type="checkbox" name="consent" required> Я ознакомился с условиями</label></p>
    <input type="submit" value="Отправить"> <input type="reset" value="Очистить">
  </form>
</body>
</html>
