<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Анкета учебного клуба</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Анкета участника учебного клуба</h1>
        <form id="club">
            <fieldset>
                <legend>Контактные данные</legend>
                <label>Имя * <input name="name" required minlength="2" autocomplete="given-name"></label>
                <label>Электронная почта * <input name="email" type="email" required autocomplete="email"></label>
                <label>Логин * <input name="login" required pattern="[A-Za-z][A-Za-z0-9_]{3,15}" title="Латинская буква, затем буквы, цифры или _. От 4 до 16 символов."></label>
                <label>Учебный пароль * <input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
                <label>Телефон <input name="phone" type="tel" placeholder="+7 900 000-00-00"></label>
                <label>Личный сайт <input name="site" type="url" placeholder="https://example.com"></label>
            </fieldset>
            <fieldset>
                <legend>Предпочтения</legend>
                <label>Дата занятия <input name="date" type="date"></label>
                <label>Удобное время <input name="time" type="time"></label>
                <label>Месяц <input name="month" type="month"></label>
                <label>Неделя <input name="week" type="week"></label>
                <label>Дата и время встречи <input name="meeting" type="datetime-local"></label>
                <label>Количество занятий <input name="count" type="number" min="1" max="20" value="4"></label>
                <label>Опыт от 0 до 10 <input name="experience" type="range" min="0" max="10" value="3"></label>
                <label>Цвет значка <input name="color" type="color" value="#225577"></label>
                <label>
                    Направление
                    <select name="track">
                        <option>HTML</option>
                        <option>CSS</option>
                        <option>JavaScript</option>
                    </select>
                </label>
                <label>
                    Город
                    <input name="city" list="cities">
                    <datalist id="cities">
                        <option value="Бирск">
                            <option value="Уфа">
                                <option value="Казань">
                                </datalist>
                            </label>
                            <label><input type="radio" name="mode" value="online" checked> Онлайн</label>
                            <label><input type="radio" name="mode" value="offline"> Очно</label>
                            <label><input type="checkbox" name="news"> Получать учебные новости</label>
                            <label>Поиск темы <input type="search" name="search"></label>
                            <label>Файл с примером <input type="file" name="sample" accept=".html,.txt"></label>
                            <label>
                                Комментарий
                                <textarea name="comment" rows="3">
                                </textarea>
                            </label>
                            <input type="hidden" name="formVersion" value="1">
                            <p>
                                Условный уровень подготовки:
                                <meter min="0" max="10" value="3">3 из 10</meter>
                            </p>
                        </fieldset>
                        <input type="submit" value="Проверить анкету">
                        <input type="reset" value="Сбросить">
                        <p id="result" role="status">
                        </p>
                        <small>Учебная форма: данные проверяются в браузере и никуда не отправляются.</small>
                    </form>
                    <script src="form.js">
                    </script>
                </body>
            </html>
