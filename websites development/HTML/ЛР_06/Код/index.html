<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Разные списки</title></head>
<body>
  <h1>Списки животных</h1>
  <h2>Первый список</h2>
  <ul type="square">
    <li>Человек</li><li>Заяц</li><li>Мышь</li><li>Слон</li>
  </ul>
  <hr color="red" size="5" width="90%">
  <h2>Второй список</h2>
  <ol type="A" start="3">
    <li>Лошадь</li><li>Ящерица</li><li>Кабан</li><li>Волк</li>
  </ol>
  <p>&lt;Мораль такова: разные списки подходят для разных задач.&gt;</p>
</body>
</html>
