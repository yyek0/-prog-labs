<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Лето — пример семантической страницы</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: auto; line-height: 1.5; }
    header, footer { background: #eee; padding: 14px; }
    nav a { margin-right: 15px; }
    aside { background: #fff4bf; padding: 12px; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Мой первый сайт</h1>
    <nav><a href="#home">Главная</a><a href="#story">Статья</a><a href="#contact">Контакты</a></nav>
  </header>
  <main id="home">
    <article id="story">
      <h2>Летний день</h2>
      <p>Летом приятно выехать за город. Мы выбрали место у воды и весь день гуляли на свежем воздухе.</p>
      <section>
        <h3>Фотография</h3>
        <figure><img src="leto.jpg" width="600" alt="Летний пейзаж"><figcaption>Рисунок 1 — лето</figcaption></figure>
        <p>На фотографии хорошо видно, каким был день.</p>
      </section>
    </article>
    <aside><strong>Примечание:</strong> рисунок хранится рядом с HTML-файлом.</aside>
  </main>
  <footer id="contact"><p>Кашапов Роман Радикович, 2026</p></footer>
</body>
</html>
